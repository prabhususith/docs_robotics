# =========================================================================
# RoboCore Studio — Multi-Container Docker Orchestration
# Hardware Optimization: ThinkBook 8GB RAM (Total Combined Memory < 900MB)
# =========================================================================

networks:
  robocore-net:
    driver: bridge

volumes:
  robocore_data:
    driver: local

services:
  # 1. Python AI Core, Kinematics & Stateless MCP (Memory cap: 380 MB)
  python-ai:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    container_name: robocore-python-ai
    restart: unless-stopped
    environment:
      - PORT_PYTHON_AI=8000
      - PYTHONUNBUFFERED=1
    networks:
      - robocore-net
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 380M
        reservations:
          memory: 150M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # 2. Node.js Express Gateway & ROS 2 DDS Broker (Memory cap: 220 MB)
  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.node
    container_name: robocore-gateway
    restart: unless-stopped
    depends_on:
      python-ai:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT_GATEWAY=5000
      - PYTHON_AI_URL=http://python-ai:8000
      - IPC_TIMEOUT_MS=1500
      - CIRCUIT_BREAKER_THRESHOLD=3
    volumes:
      - robocore_data:/app/data
    networks:
      - robocore-net
    deploy:
      resources:
        limits:
          cpus: "0.80"
          memory: 220M
        reservations:
          memory: 100M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # 3. React + TypeScript Control Plane UI (Memory cap: 120 MB)
  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ui
    container_name: robocore-ui
    restart: unless-stopped
    networks:
      - robocore-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 120M
        reservations:
          memory: 40M

  # 4. Unified Reverse Proxy & Static Asset Server (Memory cap: 80 MB)
  proxy:
    image: nginx:alpine-slim
    container_name: robocore-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docs/ebooks:/usr/share/nginx/ebooks:ro
    depends_on:
      - ui
      - gateway
      - python-ai
    networks:
      - robocore-net
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 80M
        reservations:
          memory: 25M
