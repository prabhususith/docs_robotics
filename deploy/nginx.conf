# =========================================================================
# RoboCore Studio — Unified Reverse Proxy & Static Asset Gateway
# Single Port 8080 Entry Point (Hardware Memory Cap: < 80MB RAM)
# =========================================================================

user nginx;
worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream Services
    upstream ui_backend {
        server ui:80;
    }

    upstream node_gateway {
        server gateway:5000;
    }

    upstream python_ai {
        server python-ai:8000;
    }

    server {
        listen 8080;
        server_name localhost;

        # Static Textbook PDFs Direct Serving
        location /ebooks/ {
            alias /usr/share/nginx/ebooks/;
            autoindex on;
            add_header Content-Disposition "inline";
            add_header Cache-Control "public, max-age=86400";
        }

        # Python FastAPI / Stateless MCP API
        location /ai/ {
            rewrite ^/ai/(.*) /$1 break;
            proxy_pass http://python_ai;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # Express REST API
        location /api/ {
            proxy_pass http://node_gateway/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # 50Hz Real-Time WebSocket Telemetry
        location /ws {
            proxy_pass http://node_gateway/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Frontend UI Control Plane
        location / {
            proxy_pass http://ui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
